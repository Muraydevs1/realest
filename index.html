<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons & PWA — generated by scripts/generate-icons.mjs.
         Google Search needs a square favicon whose size is a multiple of 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#C80010" />
    <meta name="application-name" content="Murray Investments Co. Ltd." />
    <meta name="apple-mobile-web-app-title" content="Murray Investments" />

    <!-- Outfit is self-hosted (public/fonts); @font-face lives in src/index.css -->
    <link
      rel="preload"
      href="/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Homepage metadata. scripts/prerender-routes.mjs copies this file once
      per route after `vite build` and rewrites the title, description,
      canonical, robots and Open Graph/Twitter tags below with that route's
      values (from src/utils/routeMeta.js), so crawlers and social scrapers
      that do not run JavaScript still get correct per-page tags. React keeps
      them in sync on client-side navigation.
      __SITE_ORIGIN__ is substituted at build time — see vite.config.js.
    -->
    <title>Murray Investments Co. Ltd. | Real Estate Development in Ghana</title>
    <meta
      name="description"
      content="Murray Investments Co. Ltd. is a Ghanaian real estate company that develops, markets and manages properties across Ghana and the West African sub-region."
    />
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="Murray Investments Co. Ltd." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Murray Investments Co. Ltd. | Real Estate Development in Ghana" />
    <meta
      property="og:description"
      content="Murray Investments Co. Ltd. is a Ghanaian real estate company that develops, markets and manages properties across Ghana and the West African sub-region."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Murray Investments Co. Ltd." />
    <meta property="og:locale" content="en_GH" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murray Investments Co. Ltd. | Real Estate Development in Ghana" />
    <meta
      name="twitter:description"
      content="Murray Investments Co. Ltd. is a Ghanaian real estate company that develops, markets and manages properties across Ghana and the West African sub-region."
    />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og-image.jpg" />

    <!--
      Google site name (https://developers.google.com/search/docs/appearance/site-names).
      Must live on the homepage; scripts/prerender-routes.mjs strips this
      block (by its id) from every other route's HTML. No SearchAction: the
      site has no search results page to point it at.
    -->
    <script type="application/ld+json" id="jsonld-website">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "__SITE_ORIGIN__/#website",
        "name": "Murray Investments Co. Ltd.",
        "alternateName": ["Murray Investments", "Murray Investments Company Limited"],
        "url": "__SITE_ORIGIN__/",
        "inLanguage": "en-GH",
        "publisher": { "@id": "__SITE_ORIGIN__/#organization" }
      }
    </script>

    <!--
      Site-level structured data. RealEstateAgent is a subtype of both
      LocalBusiness and Organization, so one node satisfies all three.
      Every value below is published elsewhere on the site — no invented
      ratings, prices, founding dates or opening hours.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "@id": "__SITE_ORIGIN__/#organization",
        "name": "Murray Investments Co. Ltd.",
        "legalName": "Murray Investments Company Limited",
        "alternateName": "Murray Investments",
        "url": "__SITE_ORIGIN__/",
        "logo": "__SITE_ORIGIN__/icon-512.png",
        "image": "__SITE_ORIGIN__/og-image.jpg",
        "description": "A Ghanaian real estate company developing, marketing and managing quality properties across Ghana and the West African sub-region.",
        "telephone": "+233244718186",
        "email": "murraygh@yahoo.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot M51, C25",
          "addressLocality": "Tema",
          "addressCountry": "GH"
        },
        "areaServed": [
          { "@type": "Country", "name": "Ghana" },
          { "@type": "Country", "name": "Burkina Faso" }
        ],
        "knowsAbout": [
          "Property Development",
          "Property Management",
          "Property Renovation",
          "Land Sale"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
